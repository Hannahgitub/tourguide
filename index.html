<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>广西导考宝典</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="main-header">
      <div class="brand-section">
        <h1 class="brand-title">广西导考宝典</h1>
      </div>
      <nav class="nav-tabs" id="main-nav-tabs">
        <button class="tab-btn active" data-tab="interview">背诵导游词</button>
        <button class="tab-btn cheatsheet-btn" data-tab="cheatsheet">💡 应试锦囊</button>
        <button class="tab-btn" data-tab="phrases">短语速记</button>
        <button class="tab-btn" data-tab="practice">刷题</button>
        <button class="tab-btn" data-tab="resources">资料下载</button>
      </nav>
    </header>

    <!-- Sub Navigation Container for 背诵导游词 (Category & Spot Chips) -->
    <div class="sub-nav-container" id="sub-nav-wrapper" style="display: none;">
      <!-- Category Filter Folding Tabs (For 英文导游词) -->
      <div class="cat-filter-tabs" id="cat-filter-container">
        <!-- Injected via JavaScript -->
      </div>

      <!-- Spot Selection Chips (For 英文导游词) -->
      <div class="spot-nav-tabs" id="spot-chips-container">
        <!-- Injected via JavaScript -->
      </div>
    </div>

    <!-- MAIN CONTENT VIEW -->
    <main id="main-content-area">
      <!-- 0. 刷题 VIEW -->
      <section id="view-practice" class="view-section" style="display: none;">
        <div class="card practice-header-card">
          <div class="practice-header-row">
            <h2 class="section-heading">真题特训刷题库</h2>
            <div class="practice-mode-toggle" id="practice-mode-toggle">
              <button class="action-btn active" id="btn-mode-card">卡片翻页</button>
              <button class="action-btn" id="btn-mode-list">完整题库</button>
            </div>
          </div>
        </div>

        <div class="cat-filter-tabs" id="practice-category-tabs" style="margin-bottom: 16px;"></div>

        <!-- 刷题模式 A: 逐题卡片翻页 -->
        <div class="card" id="practice-main-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span id="practice-num-badge" style="font-size: 12.5px; font-weight: 700; color: #6b7280; background: #f3f4f6; border: 1px solid #e5e7eb; padding: 2px 8px; border-radius: 4px; display: inline-block;">#1</span>
            <span class="qa-tag-badge" id="practice-tag-badge" style="background: #eef2ff; color: #3b82f6; border: 1px solid #bfdbfe; font-weight: 600;"></span>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px;">
            <h3 class="qa-question-title" style="font-size: 17px; margin-bottom: 0; color: #1a1a1a; flex: 1;" id="practice-en-question">Loading...</h3>
            <button class="action-btn" id="btn-practice-listen" title="听题" style="padding: 4px 10px; font-size: 15px; background: #ebf5ee; border: 1px solid #c6e2ce; color: #2d7a4c; border-radius: 50%; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: transform 0.2s;">🔊</button>
          </div>
          <div style="font-size: 14.5px; color: #666; font-weight: 500; margin-bottom: 14px;" id="practice-cn-question"></div>

          <div style="display: flex; gap: 12px; margin-bottom: 14px; align-items: center;">
            <button class="play-main-btn" id="btn-practice-toggle-ans" style="padding: 6px 20px; font-size: 13px;">参考答案</button>
          </div>

          <div class="ref-answer-box" id="practice-ref-box" style="display: none; margin-bottom: 16px;">
            <div class="ref-answer-text" id="practice-ref-text"></div>
          </div>

          <div class="ai-dialog-box">
            <div class="ai-dialog-title">✍️ 考场作答训练</div>
            <textarea class="user-input-textarea" id="practice-user-input" placeholder="在此输入你的英文回答或作答要点..."></textarea>
          </div>

          <div class="page-nav-bar" style="margin-top: 20px;">
            <button class="btn-nav-prev" id="btn-practice-prev">← 上一题</button>
            <button class="btn-nav-next" id="btn-practice-next">下一题 →</button>
          </div>
        </div>

        <!-- 刷题模式 B: 迁移过来的全量问答题库列表容器 -->
        <div id="practice-list-container" style="display: none;"></div>
      </section>

      <!-- 3. 背诵导游词 (英文导游词 PAGE VIEW) -->
      <section id="view-speech" class="view-section" style="display: none;">
        <div id="speech-cards-container"></div>
      </section>

      <!-- 10. 应试锦囊 VIEW (只保留锦囊) -->
      <section id="view-cheatsheet" class="view-section" style="display: none;">
        <div class="card section-header-card section-header-warm">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div>
              <h2 class="section-heading section-heading-red" style="margin-bottom: 4px;">💡 广西英文导游现场考试·通用应试锦囊</h2>
              <span style="font-size: 13.5px; color: #666;">《24广西英导词》（官方考纲答案） + 《导游服务能力讲义》（万能应试解题器）融会贯通版</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
              <a href="./materials/导游服务能力（导游词技巧）讲义.docx" target="_blank" download="导游服务能力（导游词技巧）讲义.docx" class="action-btn" style="background: #ebf5ee; border-color: #a3d9b1; color: #25663e; font-weight: 700; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);">
                📥 下载原版讲义 (.docx)
              </a>
              <div class="practice-mode-toggle" id="cheatsheet-subnav">
                <button class="action-btn active" id="btn-cheat-topic">专题讲解万用模板</button>
                <button class="action-btn" id="btn-cheat-spot">景点讲解万用模板</button>
                <button class="action-btn" id="btn-cheat-emergency">突发问答三步法</button>
              </div>
            </div>
          </div>
        </div>

        <div id="cheatsheet-content-container"></div>
      </section>

      <!-- 8. 复习资料概览 VIEW -->
      <section id="view-resources" class="view-section" style="display: none;">
        <div class="cat-filter-tabs" id="resource-category-tabs" style="margin-bottom: 12px;"></div>
        <div class="spot-nav-tabs" id="resource-sub-tabs" style="margin-bottom: 16px;"></div>
        <div class="card" style="padding: 0;">
          <div id="resource-list-container"></div>
        </div>
      </section>

      <!-- 9. 短语速记 VIEW (新增，严格隔离) -->
      <section id="view-phrases" class="view-section" style="display: none;">
        <div class="card section-header-card section-header-warm">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div>
              <h2 class="section-heading section-heading-red" style="margin-bottom: 4px;">⚡ 导游高频短语速记</h2>
              <span style="font-size: 13px; color: #666;">涵盖考纲10大服务基本原则与流程专题 · 记忆卡片与导游词实战例句</span>
            </div>
            <div class="practice-mode-toggle" id="phrase-mode-toggle">
              <button class="action-btn active" id="btn-phrase-mode-card">卡片速记</button>
              <button class="action-btn" id="btn-phrase-mode-list">短语列表</button>
            </div>
          </div>
        </div>

        <!-- 专题分类 (下拉选择框) + 右侧重置进度按钮 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap;">
          <!-- 左侧：下拉选择框容器 -->
          <div id="phrases-category-tabs" style="flex: 1; max-width: 320px;"></div>

          <!-- 右侧：重置进度按钮 -->
          <button class="action-btn" id="btn-phrase-reset" style="padding: 6px 14px; font-size: 12px; background: #fff; border: 1px solid #e5e7eb; color: #6b7280; border-radius: 8px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); flex-shrink: 0;">
            🔄 重置进度
          </button>
        </div>

        <!-- 模式 A: 墨墨背单词式卡片速记 -->
        <div class="card" id="phrase-main-card" style="padding: 16px 20px 20px; min-height: 280px; display: flex; flex-direction: column; justify-content: space-between; position: relative;">
          <div style="display: flex; flex-direction: column; flex: 1;">
            <!-- 顶部行：纯净专题标签，右侧显示简洁计数 -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span class="qa-tag-badge" id="phrase-tag-badge" style="background: #ebf5ee; color: #2d7a4c; border: 1px solid #c6e2ce; font-weight: 600; font-size: 12px; padding: 3px 10px; border-radius: 12px;"></span>
              <span id="phrase-card-counter" style="font-size: 13px; color: #888; font-weight: 600;">1 / 20</span>
            </div>

            <!-- 中部短语与发音展示区 -->
            <div style="text-align: center; margin: 12px 0 4px;">
              <div style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 4px;">
                <h3 id="phrase-en-title" style="font-size: 26px; font-weight: 800; color: #1a1a1a; margin: 0; letter-spacing: -0.3px; line-height: 1.3;">Loading...</h3>
                <button class="action-btn" id="btn-phrase-speak" title="听发音" style="padding: 4px 10px; font-size: 16px; background: #ebf5ee; border: 1px solid #c6e2ce; color: #2d7a4c; border-radius: 50%; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: transform 0.2s;">🔊</button>
              </div>
            </div>

            <!-- 翻转展示区（翻转后展示） -->
            <div id="phrase-answer-box" style="display: none; background: #f6faf7; border: 1px solid #d4e8da; border-radius: 12px; padding: 16px; text-align: left; margin-top: 10px;">
              <div style="font-size: 18px; font-weight: 700; color: #2d7a4c; margin-bottom: 8px; text-align: center;" id="phrase-cn-text"></div>
              <div id="phrase-example-text" style="font-size: 14px; color: #4b5563; line-height: 1.6; border-top: 1px dashed #c6e2ce; padding-top: 10px; margin-top: 10px;"></div>
            </div>

            <!-- 未翻转时的全空白点击翻转区（撑满短语下方所有空白区域，文字垂直水平居中） -->
            <div id="phrase-unrevealed-actions" style="display: flex; flex: 1; align-items: center; justify-content: center; min-height: 140px; cursor: pointer; user-select: none; border-radius: 10px; transition: background 0.15s;">
              <span id="btn-phrase-reveal" style="color: #94a3b8; font-size: 14.5px; font-weight: 600; padding: 12px 24px; pointer-events: none;">
                点击查看释义
              </span>
            </div>
          </div>

          <!-- 翻转后的熟练度按键区 -->
          <div id="phrase-revealed-actions" style="display: none; margin-top: 16px; display: flex; gap: 10px; justify-content: center;">
            <button class="action-btn" id="btn-phrase-mastered" style="flex: 1; padding: 12px 6px; font-size: 13.5px; font-weight: 700; background: #f0fdf4; color: #16a34a; border-color: #86efac;">
              ✅ 认识
            </button>
            <button class="action-btn" id="btn-phrase-vague" style="flex: 1; padding: 12px 6px; font-size: 13.5px; font-weight: 700; background: #fffbeb; color: #d97706; border-color: #fcd34d;">
              🤔 模糊
            </button>
            <button class="action-btn" id="btn-phrase-again" style="flex: 1; padding: 12px 6px; font-size: 13.5px; font-weight: 700; background: #fef2f2; color: #dc2626; border-color: #fca5a5;">
              ❌ 不认识
            </button>
          </div>
        </div>

        <!-- 模式 B: 短语全量列表 -->
        <div id="phrase-list-container" style="display: none;"></div>
      </section>
    </main>
  </div>

  <!-- 隐藏全局兜底语速节点 (防止 JavaScript 空指针异常) -->
  <select id="speech-rate-select" style="display: none;"><option value="1.0" selected>1.0</option></select>

  <script src="data.js?v=20260814_v31" charset="UTF-8"></script>
  <script src="app.js?v=20260814_v31" charset="UTF-8"></script>
</body>
</html>
